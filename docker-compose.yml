version: "3.8"

services:
  db:
    image: postgres:14-alpine
    container_name: blog_db
    env_file:
      - .env
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: blog_frontend
    env_file:
      - .env
    environment:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      - AWS_S3_BUCKET
      - S3_AVATARS_PREFIX
      - S3_CONTENT_IMAGES_PREFIX
      - S3_CONTENT_PDFS_PREFIX
      - PORT
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./:/app:cached
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    ports:
      - "3003:3003"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    command: >
      sh -c "
        # 1. wait for Postgres to be ready
        until pg_isready -h db -U $${POSTGRES_USER}; do sleep 1; done &&
        # 2. apply migrations and generate Prisma client
        npx prisma migrate deploy &&
        npx prisma generate &&
        # 3. start Next.js in dev mode
        npm run dev
      "

volumes:
  node_modules:
  next_cache:

networks:
  app-network:
    external: true
